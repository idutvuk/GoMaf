<!DOCTYPE html>
<!-- TODO add working image embed (embed issue lol) -->
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Правила игры Мафия</title>
    <!-- Локальная версия markdown-рендерера (без доступа к интернету) -->
    <script src="marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
        }
        h1 {
            color: #000;
            font-size: 1.8em;
            font-weight: bold;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        h2 {
            color: #000;
            font-size: 1.4em;
            font-weight: bold;
            margin-top: 1.2em;
            margin-bottom: 0.5em;
        }
        h3 {
            color: #000;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;
        }
        p {
            margin: 0.8em 0;
            text-align: justify;
        }
        ul, ol {
            margin: 0.8em 0;
            padding-left: 2em;
        }
        li {
            margin: 0.4em 0;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1em auto;
        }
        strong {
            font-weight: bold;
        }
        em {
            font-style: italic;
        }
        code {
            background-color: #f4f4f4;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        pre {
            background-color: #f4f4f4;
            padding: 1em;
            border-radius: 5px;
            overflow-x: auto;
        }
        blockquote {
            border-left: 4px solid #ddd;
            margin: 1em 0;
            padding-left: 1em;
            color: #666;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
            font-weight: bold;
        }
        #content {
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="content">
        <div class="loading">Загрузка правил...</div>
    </div>

    <script>
        // Исправляем пути к изображениям в markdown перед рендерингом
        function fixImagePaths(markdown) {
            // Исправляем опечатки в именах файлов
            markdown = markdown.replace(/judde_yes\.jpg/g, 'judge_yes.jpg');
            markdown = markdown.replace(/judde_no\.jpg/g, 'judge_no.jpg');
            
            // Преобразуем относительные пути к изображениям в пути к assets
            markdown = markdown.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(match, alt, src) {
                // Если путь не начинается с http/https, добавляем file:///android_asset/
                if (!src.startsWith('http://') && !src.startsWith('https://')) {
                    return '![' + alt + '](file:///android_asset/' + src + ')';
                }
                return match;
            });
            
            return markdown;
        }

        // Загружаем markdown файл через XMLHttpRequest (работает лучше с file:// протоколом)
        function loadMarkdown() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'file:///android_asset/mafia_rules.md', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 0 || xhr.status === 200) {
                        const markdown = xhr.responseText;
                        
                        // Исправляем пути к изображениям
                        const fixedMarkdown = fixImagePaths(markdown);
                        
                        // Рендерим markdown в HTML
                        const html = marked.parse(fixedMarkdown, {
                            breaks: true,
                            gfm: true
                        });
                        
                        // Вставляем результат в страницу
                        document.getElementById('content').innerHTML = html;
                    } else {
                        document.getElementById('content').innerHTML = 
                            '<div style="color: red; padding: 20px;">Ошибка загрузки правил. Код ошибки: ' + xhr.status + '</div>';
                    }
                }
            };
            xhr.onerror = function() {
                document.getElementById('content').innerHTML = 
                    '<div style="color: red; padding: 20px;">Ошибка загрузки файла правил</div>';
            };
            xhr.send();
        }

        // Загружаем markdown после загрузки страницы
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadMarkdown);
        } else {
            loadMarkdown();
        }
    </script>
</body>
</html>
